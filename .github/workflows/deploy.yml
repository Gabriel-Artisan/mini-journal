name: Deploy approved static website

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved application version
        required: true
        default: '1.2.0'
        type: string
      source_commit:
        description: Approved private source commit (full SHA)
        required: true
        default: '3777b0e04918ca22a7729e4d48371ea99a80f721'
        type: string

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify approved artifact and complete file checksums
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { lstat, readFile, readdir } from 'node:fs/promises';
          assert((await lstat('site')).isDirectory());
          assert(!(await lstat('site')).isSymbolicLink());
          assert(!(await lstat('site/assets')).isSymbolicLink());
          assert((await lstat('site/release.json')).isFile());
          const manifest = JSON.parse(await readFile('site/release.json', 'utf8'));
          assert(/^\d+\.\d+\.\d+$/.test(manifest.version));
          assert(/^[a-f0-9]{40}$/.test(manifest.sourceCommit));
          assert.equal(manifest.version, process.env.EXPECTED_VERSION);
          assert.equal(manifest.sourceCommit, process.env.EXPECTED_COMMIT);
          const files = Object.keys(manifest.files).sort();
          assert.equal(files.length, 4);
          assert(files.includes('index.html') && files.includes('sw.js'));
          assert.equal(files.filter(p => /^assets\/index-[A-Za-z0-9_-]+\.js$/.test(p)).length, 1);
          assert.equal(files.filter(p => /^assets\/index-[A-Za-z0-9_-]+\.css$/.test(p)).length, 1);
          const actual = (await readdir('site')).filter(p => p !== 'assets' && p !== 'release.json');
          actual.push(...(await readdir('site/assets')).map(p => 'assets/' + p));
          assert.deepEqual(actual.sort(), files);
          for (const path of files) {
            assert((await lstat('site/' + path)).isFile());
            assert(/^[a-f0-9]{64}$/.test(manifest.files[path]));
            const bytes = await readFile('site/' + path);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), manifest.files[path]);
          }
          console.log('Approved version, source and all production checksums verified.');
          NODE
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
